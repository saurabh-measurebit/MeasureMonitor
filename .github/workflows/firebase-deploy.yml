name: Deploy to Firebase
'on':
  push:
    branches:
      - dev
      - main
    paths:
      - 'ui/**'
      - '.github/workflows/**'
      - 'firebase.json'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm install
          npm install -g firebase-tools

      - name: Create Environment File
        run: |
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
          echo "FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}" >> .env
          echo "FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}" >> .env
          echo "NODE_ENV=production" >> .env

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase use ${{ secrets.FIREBASE_PROJECT_ID }}
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }} \
              --token ${{ secrets.FIREBASE_TOKEN }} \
              --message "Deployed from main branch ${{ github.sha }}" \
              --json
          else
            firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }} \
              --token ${{ secrets.FIREBASE_TOKEN }} \
              --channel dev \
              --message "Deployed from dev branch ${{ github.sha }}" \
              --json
          fi

      - name: Get Deploy URL
        id: deploy_url
        run: |
          DEPLOY_URL=$(firebase hosting:channel:list --project ${{ secrets.FIREBASE_PROJECT_ID }} --token ${{ secrets.FIREBASE_TOKEN }} | grep -o 'https://.*dev.*firebaseapp.com')
          echo "::set-output name=url::$DEPLOY_URL"

      - name: Comment on Commit
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const context = github.context;
            const deployUrl = '${{ steps.deploy_url.outputs.url }}';
            
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 Deployed to dev channel: ${deployUrl}`
            });
